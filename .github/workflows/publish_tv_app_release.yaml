name: TV release build
#推送Tag时触发
on:
  push:
    tags:
      - "tv_*"
jobs:
  verify-version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check tag and TV version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          from pathlib import Path
          pubspec = Path('simple_live_tv_app/pubspec.yaml').read_text()
          version, build = re.search(r'^version: (.+)\+(\d+)$', pubspec, re.M).groups()
          metadata = json.loads(Path('assets/tv_app_version.json').read_text())
          assert os.environ['RELEASE_TAG'] == f'tv_{version}', 'Tag and TV version differ'
          assert metadata['version'] == version, 'TV update metadata version differs'
          assert metadata['version_num'] == int(build), 'TV update metadata build differs'
          print(f'TV release version verified: {version}+{build}')
          PYTHON
      - name: Check APK certificate parser
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
  build-tv:
    needs: verify-version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      #签出代码
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      #APK签名设置
      - name: Configure Android TV release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.TV_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.TV_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.TV_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.TV_KEY_ALIAS }}
        run: |
          python3 - <<'PYTHON'
          import base64
          import os
          from pathlib import Path
          names = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_STORE_PASSWORD', 'ANDROID_KEY_PASSWORD', 'ANDROID_KEY_ALIAS']
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing Android TV signing configuration: ' + ', '.join(missing))
          os.umask(0o077)
          keystore = Path(os.environ['RUNNER_TEMP']) / 'android-tv-release.jks'
          keystore.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          properties = {
              'storeFile': str(keystore),
              'storePassword': os.environ['ANDROID_STORE_PASSWORD'],
              'keyPassword': os.environ['ANDROID_KEY_PASSWORD'],
              'keyAlias': os.environ['ANDROID_KEY_ALIAS'],
          }
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          Path('simple_live_tv_app/android/key.properties').write_text(''.join(f'{key}={escape(value)}\n' for key, value in properties.items()))
          PYTHON

      # 设置JAVA环境
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      #设置Flutter
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          cache: true

      #更新Flutter的packages
      - name: Restore packages
        run: |
          cd simple_live_tv_app
          flutter pub get --enforce-lockfile

      #打包APK
      - name: Build APK
        run: |
          cd simple_live_tv_app
          flutter build apk --release --split-per-abi

      - name: Verify Android TV release APKs
        run: python3 .github/scripts/verify_android_release.py simple_live_tv_app

      #上传APK至Artifacts
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android_tv
          if-no-files-found: error
          path: |
            simple_live_tv_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

      #读取版本信息
      - name: Read version
        id: version
        uses: juliangruber/read-file-action@v1
        with:
          path: assets/tv_app_version.json
      - name: Echo version
        run: echo "${{ fromJson(steps.version.outputs.content).version }}"
      - name: Echo version content
        run: echo "${{ fromJson(steps.version.outputs.content).version_desc }}"

      #上传至Release
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          name: "${{ fromJson(steps.version.outputs.content).version }}"
          body: "# Android TV \n${{ fromJson(steps.version.outputs.content).version_desc }}"
          draft: true
          prerelease: ${{ fromJson(steps.version.outputs.content).prerelease }}
          token: ${{ secrets.TOKEN || github.token }}
          files: |
            simple_live_tv_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      #完成
      - run: echo "🍏 This job's status is ${{ job.status }}."
